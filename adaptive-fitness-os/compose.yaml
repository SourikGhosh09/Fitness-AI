services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fitness
      POSTGRES_DB: fitness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD}
    volumes: [fitness-db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U fitness]
      interval: 5s
      retries: 10
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL using host database}
    command: [python, -m, fitness.setup]
    depends_on:
      database:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL using host database}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SURVEY_FORM_ID: ${SURVEY_FORM_ID:-}
      SURVEY_WEBHOOK_SECRET: ${SURVEY_WEBHOOK_SECRET:-}
    ports: [127.0.0.1:8000:8000]
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  trainer:
    profiles: [learning]
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL using host database}
    command: [python, -m, fitness.ml, watch, --interval-hours, "24"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  survey-worker:
    profiles: [survey]
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL using host database}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    command: [python, -m, fitness.survey_worker, --interval-seconds, "900"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  notion-worker:
    profiles: [notion]
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL using host database}
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      NOTION_DATA_SOURCE_ID: ${NOTION_DATA_SOURCE_ID:-f334c7a2-43bc-4663-a74c-55575df24f07}
    command: [python, -m, fitness.notion_worker, --interval-seconds, "300"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
volumes:
  fitness-db:
