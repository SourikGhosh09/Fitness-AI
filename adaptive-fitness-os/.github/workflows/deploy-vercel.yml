name: Deploy Fitness AI

on:
  workflow_dispatch:
    inputs:
      target:
        description: Vercel environment (configure a separate database for preview)
        type: choice
        options: [preview, production]
        default: preview
        required: true

permissions:
  contents: read

concurrency:
  group: fitness-vercel-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/prepare_assets.py
      - run: pip install -r backend/requirements.lock
      - run: python -m pytest -q
        working-directory: backend

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --global vercel@59.16.0
      - name: Build and deploy the configured Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DEPLOY_TARGET: ${{ inputs.target }}
        run: python scripts/deploy_vercel_ci.py
