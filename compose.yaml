services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fitness
      POSTGRES_DB: fitness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD}
    volumes: [fitness-db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U fitness]
      interval: 5s
      retries: 10
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL using host database}
    command: [python, -m, fitness.setup]
    depends_on:
      database:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL using host database}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports: [127.0.0.1:8000:8000]
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
volumes:
  fitness-db:
